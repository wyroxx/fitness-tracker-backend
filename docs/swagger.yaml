definitions:
  fitness-tracker-backend_user_handler.errorResponse:
    properties:
      error:
        type: string
    type: object
  fitness-tracker-backend_workout_handler.errorResponse:
    properties:
      error:
        type: string
    type: object
  handler.createUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  handler.exerciseResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.profileStatsResponse:
    properties:
      ai_insight:
        type: string
      last_training_at:
        type: string
      total_exercise_sessions:
        type: integer
      total_workouts:
        type: integer
      trainings_this_week:
        type: integer
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.suggestionResponse:
    properties:
      suggestion:
        type: string
    type: object
  handler.tokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handler.trainingRequest:
    properties:
      sessions:
        items:
          $ref: '#/definitions/handler.workoutRequest'
        type: array
      started_at:
        type: string
      title:
        type: string
    required:
    - sessions
    - started_at
    - title
    type: object
  handler.workoutExerciseRequest:
    properties:
      id:
        type: integer
      name:
        type: string
      sets:
        items:
          $ref: '#/definitions/handler.workoutSetRequest'
        type: array
    required:
    - id
    - name
    - sets
    type: object
  handler.workoutExerciseResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      sets:
        items:
          $ref: '#/definitions/handler.workoutSetResponse'
        type: array
    type: object
  handler.workoutRequest:
    properties:
      exercises:
        items:
          $ref: '#/definitions/handler.workoutExerciseRequest'
        type: array
      started_at:
        type: string
      title:
        type: string
    required:
    - exercises
    - started_at
    - title
    type: object
  handler.workoutResponse:
    properties:
      exercises:
        items:
          $ref: '#/definitions/handler.workoutExerciseResponse'
        type: array
      started_at:
        type: string
      title:
        type: string
    type: object
  handler.workoutSetRequest:
    properties:
      reps:
        example: 10
        minimum: 0
        type: integer
      set_number:
        example: 1
        minimum: 0
        type: integer
      weight:
        description: External load in kilograms; omit for bodyweight exercises.
        example: 50
        minimum: 0
        type: integer
    type: object
  handler.workoutSetResponse:
    properties:
      reps:
        type: integer
      set_number:
        type: integer
      weight:
        type: integer
    type: object
  models.MuscleGroup:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      passwordHash:
        type: string
    type: object
info:
  contact: {}
  description: 'API matching the current FitnessTracker Swift app. GET /trainings
    returns [Workout]; POST accepts CreateWorkoutRequest with sessions: [Workout].
    Weight and reps are optional integers.'
  title: Fitness Tracker API
  version: "3.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns JWT pair
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Logout (client-side token discard)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new JWT pair
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
      summary: Refresh JWT tokens
      tags:
      - auth
  /muscle-groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MuscleGroup'
            type: array
      security:
      - BearerAuth: []
      summary: List muscle groups
      tags:
      - muscle-groups
  /muscle-groups/{id}/workout-types:
    get:
      parameters:
      - description: MuscleGroup ID
        in: path
        name: id
        required: true
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.exerciseResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List workout types by muscle group
      tags:
      - workout-types
  /profile/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.profileStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current user's workout stats
      tags:
      - profile
  /suggest-workout:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.suggestionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Suggest next workout
      tags:
      - workout-suggestions
  /trainings:
    get:
      description: Returns all current-user workouts as a bare array matching [Workout]
        in Swift.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.workoutResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List trainings for current user
      tags:
      - trainings
    post:
      consumes:
      - application/json
      description: sessions contains one Workout with title, started_at and exercises,
        as sent by the current Swift app.
      parameters:
      - description: Training
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.trainingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.workoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Create training from the Swift CreateWorkoutRequest
      tags:
      - trainings
  /trainings/{id}:
    delete:
      parameters:
      - description: Training ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete training
      tags:
      - trainings
  /users:
    post:
      consumes:
      - application/json
      description: Creates a user and returns the stored record
      parameters:
      - description: User info
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
      summary: Register new user
      tags:
      - users
  /users/me:
    get:
      description: Returns the authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Provide your JWT with the "Bearer " prefix. Example: "Bearer {token}".'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
