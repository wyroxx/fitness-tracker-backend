definitions:
  fitness-tracker-backend_user_handler.errorResponse:
    properties:
      error:
        type: string
    type: object
  fitness-tracker-backend_workout_handler.errorResponse:
    properties:
      error:
        type: string
    type: object
  handler.coachRequest:
    properties:
      question:
        maxLength: 2000
        type: string
    type: object
  handler.coachResponse:
    properties:
      answer:
        type: string
    type: object
  handler.createUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  handler.exerciseResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.muscleBalance:
    properties:
      muscle_group_id:
        type: integer
      name:
        type: string
      sets:
        type: integer
      share_percent:
        type: number
    type: object
  handler.overviewResponse:
    properties:
      from:
        type: string
      muscle_balance:
        items:
          $ref: '#/definitions/handler.muscleBalance'
        type: array
      sets:
        type: integer
      to:
        type: string
      volume_kg:
        type: number
      workouts:
        type: integer
    type: object
  handler.profileStatsResponse:
    properties:
      ai_insight:
        type: string
      last_training_at:
        type: string
      total_exercise_sessions:
        type: integer
      total_workouts:
        type: integer
      trainings_this_week:
        type: integer
    type: object
  handler.progressExercise:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  handler.progressPoint:
    properties:
      date:
        type: string
      estimated_1rm_kg:
        type: number
      training_id:
        type: integer
    type: object
  handler.progressResponse:
    properties:
      change_percent:
        type: number
      exercises:
        items:
          $ref: '#/definitions/handler.progressExercise'
        type: array
      from:
        type: string
      points:
        items:
          $ref: '#/definitions/handler.progressPoint'
        type: array
      to:
        type: string
      workout_type_id:
        type: integer
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.suggestionResponse:
    properties:
      suggestion:
        type: string
    type: object
  handler.tokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handler.trainingRequest:
    properties:
      sessions:
        items:
          $ref: '#/definitions/handler.workoutRequest'
        type: array
      started_at:
        type: string
      title:
        type: string
    required:
    - sessions
    - started_at
    - title
    type: object
  handler.workoutExerciseRequest:
    properties:
      id:
        type: integer
      name:
        type: string
      sets:
        items:
          $ref: '#/definitions/handler.workoutSetRequest'
        type: array
    required:
    - id
    - name
    - sets
    type: object
  handler.workoutExerciseResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      sets:
        items:
          $ref: '#/definitions/handler.workoutSetResponse'
        type: array
    type: object
  handler.workoutRequest:
    properties:
      exercises:
        items:
          $ref: '#/definitions/handler.workoutExerciseRequest'
        type: array
      started_at:
        type: string
      title:
        type: string
    required:
    - exercises
    - started_at
    - title
    type: object
  handler.workoutResponse:
    properties:
      exercises:
        items:
          $ref: '#/definitions/handler.workoutExerciseResponse'
        type: array
      id:
        type: integer
      started_at:
        type: string
      title:
        type: string
    type: object
  handler.workoutSetRequest:
    properties:
      reps:
        example: 10
        minimum: 0
        type: integer
      set_number:
        example: 1
        minimum: 0
        type: integer
      weight:
        description: External load in kilograms; omit for bodyweight exercises.
        example: 50
        minimum: 0
        type: integer
    type: object
  handler.workoutSetResponse:
    properties:
      reps:
        type: integer
      set_number:
        type: integer
      weight:
        type: integer
    type: object
  models.MuscleGroup:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      passwordHash:
        type: string
    type: object
info:
  contact: {}
  description: 'API matching the current FitnessTracker Swift app. GET /trainings
    returns [Workout]; POST accepts CreateWorkoutRequest with sessions: [Workout].
    Weight and reps are optional integers.'
  title: Fitness Tracker API
  version: "3.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns JWT pair
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Logout (client-side token discard)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new JWT pair
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
      summary: Refresh JWT tokens
      tags:
      - auth
  /muscle-groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MuscleGroup'
            type: array
      security:
      - BearerAuth: []
      summary: List muscle groups
      tags:
      - muscle-groups
  /muscle-groups/{id}/workout-types:
    get:
      parameters:
      - description: MuscleGroup ID
        in: path
        name: id
        required: true
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.exerciseResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List workout types by muscle group
      tags:
      - workout-types
  /profile/coach/messages:
    post:
      consumes:
      - application/json
      description: Each request is independent. Send {} for an overview or a question
        up to 2000 characters. Context contains only the authenticated user's seven-day
        summary. No messages are stored.
      parameters:
      - description: Optional question
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.coachRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.coachResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Ask the AI coach without a conversation
      tags:
      - profile
  /profile/overview:
    get:
      description: UTC rolling interval [from,to). Sets require positive reps; volume
        is sum(weight*reps) in kg. Muscle balance is each primary group's share of
        counted sets, not a target score.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.overviewResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Profile overview for the last seven days
      tags:
      - profile
  /profile/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.profileStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current user's workout stats
      tags:
      - profile
  /profile/strength-progress:
    get:
      description: Dates are UTC YYYY-MM-DD, inclusive calendar dates; default last
        90 days, maximum 366 days. Epley for 2-10 reps; 1 rep uses actual weight.
        Best set per training. Change compares first and last points; null with fewer
        than two points. Exercises lists those with eligible sets in this period.
        Without an ID, selects the lowest available ID.
      parameters:
      - description: Exercise ID
        in: query
        name: workout_type_id
        type: integer
      - description: First date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Last date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.progressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Estimated strength progress
      tags:
      - profile
  /suggest-workout:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.suggestionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Suggest next workout
      tags:
      - workout-suggestions
  /trainings:
    get:
      description: Returns all current-user workouts as a bare array matching [Workout]
        in Swift.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.workoutResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List trainings for current user
      tags:
      - trainings
    post:
      consumes:
      - application/json
      description: sessions contains one Workout with title, started_at and exercises,
        as sent by the current Swift app.
      parameters:
      - description: Training
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.trainingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.workoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Create training from the Swift CreateWorkoutRequest
      tags:
      - trainings
  /trainings/{id}:
    delete:
      parameters:
      - description: Training ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_workout_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete training
      tags:
      - trainings
  /users:
    post:
      consumes:
      - application/json
      description: Creates a user and returns the stored record
      parameters:
      - description: User info
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
      summary: Register new user
      tags:
      - users
  /users/me:
    get:
      description: Returns the authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fitness-tracker-backend_user_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Provide your JWT with the "Bearer " prefix. Example: "Bearer {token}".'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
