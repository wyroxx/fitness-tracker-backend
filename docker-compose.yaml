services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitness_tracker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Go API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Web server port inside container
      PORT: 8080
      # Database connection string (internal host names)
      DATABASE_URL: postgres://postgres:postgres@db:5432/fitness_tracker?sslmode=disable
      # Groq LLM configuration. Export GROQ_API_KEY before running docker compose.
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: llama-3.1-8b-instant
    ports:
      - "8080:8080"

volumes:
  db-data:
